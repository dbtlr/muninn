name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # The runner image's Chromium snapshot. Pinned so the renderer suite
      # fails, rather than skips or silently switches browsers, if it moves.
      MUNINN_CHROMIUM_PATH: /usr/bin/chromium
    steps:
      # A fresh runner's disk reads Chromium's 600MB install slowly (10-30s,
      # sometimes far more), and a cold launch pays for it inside the
      # renderer suite's warm-up hook. Read it into the page cache while
      # dependencies install, and wait for that before the tests start.
      - name: Read Chromium into the page cache
        run: |
          (
            if [ -e "$MUNINN_CHROMIUM_PATH" ]; then
              find "$(dirname "$(readlink -f "$MUNINN_CHROMIUM_PATH")")" -type f -print0 |
                xargs -0 cat > /dev/null
            fi
            touch "$RUNNER_TEMP/chromium-read"
          ) &
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Chromium's files
        timeout-minutes: 5
        run: until [ -e "$RUNNER_TEMP/chromium-read" ]; do sleep 1; done
      - run: pnpm test

  application-build:
    name: Application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Builds the Cloudflare Worker without deploying it and fails if the
      # bundle reaches a Node-only module.
      - run: pnpm worker:check

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag muninn:ci .
      # The image removes Mesa's GPU drivers that Debian's Chromium depends on
      # (see the Dockerfile). Rendering one thumbnail on this amd64 runner
      # proves the headless shell still draws without them on the deployed
      # architecture, and that the container reaches healthy.
      - name: Render a thumbnail in the image
        run: |
          set -o pipefail
          # A failing command prints the container's log before the step fails.
          trap 'docker logs muninn-ci' ERR
          docker run --detach --name muninn-ci --publish 127.0.0.1:4242:4242 muninn:ci
          for attempt in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' muninn-ci)" = healthy ] && break
            sleep 1
          done
          docker inspect --format '{{.State.Health.Status}}' muninn-ci | grep --quiet --line-regexp healthy
          id=$(curl --fail --silent --show-error --request POST http://127.0.0.1:4242/mcp \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"add_artifact","arguments":{"title":"CI","description":"Thumbnail smoke test","project":"ci","mediaType":"text/markdown","content":"# Smoke 🎉\n\nInter 0123456789"}}}' \
            | sed -n 's/^data: //p; /^{/p' | head -n 1 | jq -r '.result.content[0].text | fromjson | .id')
          for attempt in $(seq 1 60); do
            type=$(curl --fail --silent --show-error --output /dev/null --write-out '%{content_type}' "http://127.0.0.1:4242/a/$id/thumb")
            [ "$type" = image/jpeg ] && exit 0
            sleep 1
          done
          docker logs muninn-ci
          exit 1
